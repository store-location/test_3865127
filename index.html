<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Union Coop | Store Locator</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- MarkerCluster (optional but helps UX when you have many stores) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

  <style>
    /* NOTE:
      Your current @font-face path in the original file points to "correct-path-to-your-font/..."
      which will fail unless you host the font files alongside this HTML.
      Keeping a clean fallback stack so the UI still looks consistent.
    */
    :root{
      --bg: #f6f9ff;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --brand: #0b74ff;
      --brand-2: #0a5bd0;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      --shadow-soft: 0 6px 18px rgba(15, 23, 42, 0.10);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    /* Dynamic viewport height (fixes mobile address bar issues) */
    :root{ --vh: 1vh; --topbarH: 64px; }


    body, #map, .leaflet-container, .leaflet-popup-content, .leaflet-control {
      font-family: "ITC Avant Garde Gothic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
    }

    body{
      margin: 0;
      background: var(--bg);
      overflow: hidden;
      height: calc(var(--vh) * 100);
    }

    /* App layout */
    .app{
      height: calc(var(--vh) * 100);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    /* Top bar */
    .topbar{
      height: 64px;
      padding-top: calc(10px + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(15,23,42,0.06);
      position: relative;
      z-index: 1000;
    }

    .brand{
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }
    .logo{
      width: 44px;
      height: auto;
      display: block;
    }
    .brand-title{
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .brand-title b{ font-size: 14px; }
    .brand-title span{ font-size: 12px; color: var(--muted); }

    .actions{
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn{
      appearance: none;
      border: 1px solid rgba(15,23,42,0.10);
      background: var(--panel);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      box-shadow: 0 2px 10px rgba(15,23,42,0.06);
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
      user-select: none;
      white-space: nowrap;
    }
    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(15,23,42,0.10);
      border-color: rgba(15,23,42,0.18);
    }
    .btn:active{ transform: translateY(0px); }

    .btn-primary{
      background: var(--brand);
      border-color: transparent;
      color: #fff;
    }
    .btn-primary:hover{ background: var(--brand-2); }

    .btn-icon{
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .search{
      width: min(360px, 42vw);
      position: relative;
    }
    .search input{
      width: 100%;
      padding: 11px 12px 11px 40px;
      border-radius: 12px;
      border: 1px solid rgba(15,23,42,0.10);
      outline: none;
      background: var(--panel);
      box-shadow: 0 2px 10px rgba(15,23,42,0.06);
      font-size: 13px;
    }
    .search .icon{
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
    }

    /* Main content */
    .content{
      height: 100%;
      position: relative;
    }

    #map{
      height: 100%;
      width: 100%;
    }

    /* Side panel */
    .panel{
      position: absolute;
      top: 14px;
      right: 14px;
      width: 360px;
      max-width: calc(100vw - 28px);
      max-height: calc(100% - 28px);
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(15,23,42,0.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      z-index: 900;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .panel-header{
      padding: 12px 14px;
      border-bottom: 1px solid rgba(15,23,42,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .panel-header .title{
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .panel-header .title b{ font-size: 14px; }
    .panel-header .title span{ font-size: 12px; color: var(--muted); }

    .panel-body{
      overflow: auto;
      padding: 8px;
    }

    .store{
      padding: 10px 10px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,0.06);
      background: rgba(255,255,255,0.86);
      box-shadow: 0 2px 10px rgba(15,23,42,0.06);
      margin-bottom: 8px;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease;
    }
    .store:hover{
      transform: translateY(-1px);
      border-color: rgba(15,23,42,0.16);
    }
    .store b{
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .store .meta{
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }
    .pill{
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(11,116,255,0.10);
      color: var(--brand-2);
      border: 1px solid rgba(11,116,255,0.18);
      font-weight: 700;
      font-size: 11px;
    }

    .panel-footer{
      padding: 10px 14px;
      border-top: 1px solid rgba(15,23,42,0.06);
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }
    .hint{
      font-size: 12px;
      color: var(--muted);
    }

    /* Mobile: slide-up sheet */
    @media (max-width: 760px){
      /* Topbar: more compact on mobile */
      .topbar{
        height: auto;
        padding: 8px 10px;
        gap: 10px;
      }
      .logo{ width: 38px; }
      .brand-title b{ font-size: 13px; }
      .brand-title span{ display:none; }
      .search{ display:none; }

      .actions{ gap: 8px; }
      .btn{
        padding: 9px 10px;
        font-size: 12px;
        border-radius: 12px;
      }
      .btn-icon{
        width: 38px;
        height: 38px;
      }

      /* Push Leaflet controls below the topbar */
      .leaflet-top.leaflet-left{
        top: calc(var(--topbarH) + 10px);
      }

      /* Panel becomes a bottom sheet */
      .panel{
        left: 10px;
        right: 10px;
        top: auto;
        bottom: calc(10px + env(safe-area-inset-bottom));
        width: auto;
        /* Dynamic height: viewport minus topbar (works across phones/browsers) */
        max-height: calc((var(--vh) * 100) - var(--topbarH) - 24px);
        border-radius: 18px;
      }

      .panel-header{
        padding: 10px 12px;
      }
      .panel-footer{
        padding: 10px 12px;
      }
    }

    /* Leaflet popup polish */
    .leaflet-popup-content-wrapper{
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
    }
    .leaflet-popup-content{
      margin: 12px 14px;
    }
    .popup-title{
      font-weight: 800;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .popup-actions{
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .link{
      color: var(--brand);
      text-decoration: none;
      font-weight: 800;
    }
    .link:hover{ text-decoration: underline; }

    /* Toast */
    .toast{
      position: absolute;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.92);
      color: white;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: var(--shadow);
      z-index: 1100;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <img src="https://www.unioncoop.ae/static/version1748470241/frontend/Ktpl/unioncoop/default/images/logo.svg" alt="Union Coop" class="logo"/>
        <div class="brand-title">
          <b>Union Coop – Store Locator</b>
          <span>Find the nearest store & open directions</span>
        </div>
      </div>

      <div class="search" title="Search stores by name">
        <span class="icon">🔎</span>
        <input id="searchBox" type="text" placeholder="Search a store (e.g., Mirdif, Al Wasl)"/>
      </div>

      <div class="actions">
        <button class="btn btn-icon" id="btnTogglePanel" title="Show/hide store list">☰</button>
        <button class="btn" id="btnLocate" title="Center map on your location">📍 Locate me</button>
        <button class="btn btn-primary" id="btnNearest" title="Find the nearest store and open directions">🧭 Nearest</button>
      </div>
    </div>

    <div class="content">
      <div id="map"></div>

      <div class="panel" id="panel">
        <div class="panel-header">
          <div class="title">
            <b>Stores</b>
            <span id="storeCount">Loading…</span>
          </div>
          <button class="btn btn-icon" id="btnFit" title="Zoom to show all stores">🗺️</button>
        </div>

        <div class="panel-body" id="storeList"></div>

        <div class="panel-footer">
          <div class="hint">Tip: click a store to zoom & open directions.</div>
          <button class="btn" id="btnReset">Reset</button>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    // -----------------------------
    // DATA
    // -----------------------------
    const stores = [
      {"name":"UNION COOP MIRDIF","lat":25.2373350826472,"lng":55.4213417828064,"url":"https://www.google.com/maps?q=25.2373350826472,55.4213417828064"},
      {"name":"UNION COOP AL BARSHA MALL","lat":25.0992345773561,"lng":55.204657740473,"url":"https://www.google.com/maps?q=25.0992345773561,55.204657740473"},
      {"name":"UNION COOP JUMEIRAH 1","lat":25.2252707866175,"lng":55.2659589828061,"url":"https://www.google.com/maps?q=25.2252707866175,55.2659589828061"},
      {"name":"UNION COOP AL AWEER","lat":25.1756577091796,"lng":55.387106290338,"url":"https://www.google.com/maps?q=25.1756577091796,55.387106290338"},
      {"name":"UNION COOP UMM SUQEIM 2","lat":25.1434664105189,"lng":55.2063896251345,"url":"https://www.google.com/maps?q=25.1434664105189,55.2063896251345"},
      {"name":"UNION COOP AL WARQAA CITY MALL","lat":25.206655714845,"lng":55.4252906674662,"url":"https://www.google.com/maps?q=25.206655714845,55.4252906674662"},
      {"name":"UNION COOP BARSHA SOUTH","lat":25.0861483971091,"lng":55.2417329539681,"url":"https://www.google.com/maps?q=25.0861483971091,55.2417329539681"},
      {"name":"UNION COOP AL WASL","lat":25.2106492295137,"lng":55.2708850674662,"url":"https://www.google.com/maps?q=25.2106492295137,55.2708850674662"},
      {"name":"UNION COOP MOTOR CITY","lat":25.0454391785398,"lng":55.233251482802,"url":"https://www.google.com/maps?q=25.0454391785398,55.233251482802"},
      {"name":"UNION COOP ALNAHDA / AL TWAR","lat":25.2704727967356,"lng":55.3716512963025,"url":"https://www.google.com/maps?q=25.2704727967356,55.3716512963025"}
    ];

    // -----------------------------
    // MAP INIT
    // -----------------------------
    const map = L.map('map', {
      zoomControl: true,
      scrollWheelZoom: true
    }).setView([25.2048, 55.2708], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }).addTo(map);

    // -----------------------------
    // MOBILE VIEWPORT FIX (dynamic height across devices)
    // -----------------------------
    function setViewportVars(){
      // Fix 100vh issues on mobile browsers (address bar)
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);

      // Track actual topbar height so panels/controls don't overlap
      const topbar = document.querySelector('.topbar');
      if(topbar){
        const h = Math.ceil(topbar.getBoundingClientRect().height);
        document.documentElement.style.setProperty('--topbarH', `${h}px`);
      }
    }
    setViewportVars();
    window.addEventListener('resize', setViewportVars);
    window.addEventListener('orientationchange', setViewportVars);

    // Cluster group for better UX
    const cluster = L.markerClusterGroup({
      showCoverageOnHover: false,
      spiderfyOnMaxZoom: true,
      maxClusterRadius: 50
    });

    // Bounds
    const bounds = L.latLngBounds([]);

    // UI elements
    const elPanel = document.getElementById('panel');
    const elStoreList = document.getElementById('storeList');
    const elStoreCount = document.getElementById('storeCount');
    const elSearch = document.getElementById('searchBox');
    const toast = document.getElementById('toast');

    // User marker
    let userMarker = null;

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function popupHtml(store, distanceKm=null){
      const dist = (distanceKm == null) ? "" : `<div style="color:#64748b; font-size:12px; margin-top:4px;">~ ${distanceKm.toFixed(2)} km away</div>`;
      return `
        <div>
          <div class="popup-title">${store.name}</div>
          ${dist}
          <div class="popup-actions">
            <a class="link" href="${store.url}" target="_blank" rel="noopener">Open in Google Maps</a>
            <a class="link" href="#" data-store="${encodeURIComponent(store.name)}">Focus</a>
          </div>
        </div>
      `;
    }

    // Create markers and list items
    const markerByName = new Map();

    function renderStores(list){
      elStoreList.innerHTML = "";
      elStoreCount.textContent = `${list.length} location${list.length===1 ? "" : "s"}`;

      list.forEach(store => {
        const item = document.createElement('div');
        item.className = 'store';
        item.innerHTML = `
          <b>${store.name}</b>
          <div class="meta">
            <span class="pill">Directions</span>
            <span>${store.lat.toFixed(4)}, ${store.lng.toFixed(4)}</span>
          </div>
        `;
        item.addEventListener('click', () => {
          focusStore(store.name);
          window.open(store.url, "_blank", "noopener");
        });
        elStoreList.appendChild(item);
      });
    }

    function focusStore(storeName){
      const marker = markerByName.get(storeName);
      if(!marker) return;
      map.setView(marker.getLatLng(), 14, { animate: true });
      marker.openPopup();
    }

    // Add markers
    stores.forEach(store => {
      const latlng = L.latLng(store.lat, store.lng);
      bounds.extend(latlng);

      const marker = L.marker(latlng);
      marker.bindPopup(popupHtml(store));
      marker.on('popupopen', (e) => {
        const node = e.popup.getElement();
        if(!node) return;
        const focusLink = node.querySelector('a[data-store]');
        if(focusLink){
          focusLink.onclick = (ev) => {
            ev.preventDefault();
            focusStore(decodeURIComponent(focusLink.getAttribute('data-store')));
          };
        }
      });

      markerByName.set(store.name, marker);
      cluster.addLayer(marker);
    });

    map.addLayer(cluster);
    map.fitBounds(bounds.pad(0.12));

    renderStores(stores);

    // -----------------------------
    // SEARCH
    // -----------------------------
    function normalize(s){ return (s||"").toLowerCase().replace(/\s+/g, " ").trim(); }

    elSearch?.addEventListener('input', () => {
      const q = normalize(elSearch.value);
      if(!q){
        renderStores(stores);
        return;
      }
      const filtered = stores.filter(s => normalize(s.name).includes(q));
      renderStores(filtered);
    });

    // -----------------------------
    // GEOLOCATION + NEAREST
    // -----------------------------
    function getLocation(cb){
      if(!navigator.geolocation){
        showToast("Geolocation not supported in this browser.");
        return;
      }
      showToast("Getting your location…");
      navigator.geolocation.getCurrentPosition(
        (pos) => cb(pos),
        (err) => showToast("Location error: " + (err.message || "unknown")),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    function setUserMarker(lat, lng){
      const latlng = L.latLng(lat, lng);
      if(userMarker){
        userMarker.setLatLng(latlng);
      }else{
        userMarker = L.circleMarker(latlng, {
          radius: 8,
          weight: 2,
          opacity: 1,
          fillOpacity: 0.35
        }).addTo(map).bindPopup("<b>You are here</b>");
      }
      map.setView(latlng, Math.max(map.getZoom(), 13), { animate: true });
    }

    function getDistanceKm(lat1, lng1, lat2, lng2){
      const R = 6371;
      const dLat = deg2rad(lat2 - lat1);
      const dLng = deg2rad(lng2 - lng1);
      const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
        Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }
    function deg2rad(deg){ return deg * (Math.PI/180); }

    function findNearest(lat, lng){
      let nearest = null;
      let minKm = Infinity;
      stores.forEach(s => {
        const km = getDistanceKm(lat, lng, s.lat, s.lng);
        if(km < minKm){
          minKm = km;
          nearest = { store: s, km };
        }
      });
      return nearest;
    }

    document.getElementById('btnLocate').addEventListener('click', () => {
      getLocation((pos) => {
        const { latitude, longitude } = pos.coords;
        setUserMarker(latitude, longitude);
        showToast("Location updated.");
      });
    });

    document.getElementById('btnNearest').addEventListener('click', () => {
      getLocation((pos) => {
        const { latitude, longitude } = pos.coords;
        setUserMarker(latitude, longitude);

        const nearest = findNearest(latitude, longitude);
        if(!nearest) return;

        const { store, km } = nearest;
        const marker = markerByName.get(store.name);
        if(marker){
          marker.setPopupContent(popupHtml(store, km));
          focusStore(store.name);
        }
        showToast(`Nearest: ${store.name} (~${km.toFixed(2)} km)`);
        window.open(store.url, "_blank", "noopener");
      });
    });

    // -----------------------------
    // PANEL BUTTONS
    // -----------------------------
    document.getElementById('btnTogglePanel').addEventListener('click', () => {
      const isHidden = elPanel.style.display === 'none';
      elPanel.style.display = isHidden ? '' : 'none';
    });

    document.getElementById('btnFit').addEventListener('click', () => {
      map.fitBounds(bounds.pad(0.12));
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      elSearch.value = "";
      renderStores(stores);
      map.fitBounds(bounds.pad(0.12));
      showToast("Reset done.");
    });

    // Welcome popup (desktop only)
    if (window.innerWidth > 760){
      L.popup({ closeButton: true, autoClose: true })
        .setLatLng(bounds.getCenter())
        .setContent(`
          <div style="max-width: 260px;">
            <div class="popup-title">Welcome 👋</div>
            <div style="color:#64748b; font-size: 12px; line-height: 1.4;">
              Use <b>Nearest</b> to open directions to the closest store, or browse the list to pick a location.
            </div>
          </div>
        `)
        .openOn(map);
    }
  </script>
</body>
</html>
